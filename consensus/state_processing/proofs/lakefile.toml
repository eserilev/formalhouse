name = "epoch_proofs"
defaultTargets = ["EpochProofs"]

# Aeneas provides the Lean semantics for the translated Rust (`Result`, `Slice`, `Array`,
# the `loop` combinator and the `step` tactic). Pinned: the generated file in
# `EpochProofs/Generated.lean` must be produced by the matching Aeneas/Charon versions.
# See README.md. The CI workflow reads `rev` from here, so this is the single source of truth.
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
rev = "453b09f98f2b593c0544a8ad654b77e2a3bc621a"
subDir = "backends/lean"

# Etheorem: an executable Lean spec of the consensus specs that passes the EF vectors.
# `EpochProofs/Etheorem/` proves our reference equal to it. Pinned, and patched for our Lean
# version by `etheorem/setup.sh`. See README.md.
[[require]]
name = "EthCLSpecs"
git = "https://github.com/etheorem/etheorem"
rev = "54a3683a4c616b93cacd5990978ecb89c78bf0e7"
subDir = "packages/EthCLSpecs"

# The BeaconState cache proofs in `consensus/types/proofs`. The epoch proofs import them to
# replace the cache facts that the epoch theorems take as hypotheses.
[[require]]
name = "cache_proofs"
path = "../../types/proofs"

# The loop proofs need more than the default budget.
[leanOptions]
maxHeartbeats = 1000000

[[lean_lib]]
name = "EpochProofs"
